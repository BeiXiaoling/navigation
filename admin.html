<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航后台</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #202327;
            --muted: #68707c;
            --line: #dfe3e8;
            --primary: #1677ff;
            --danger: #d92d20;
            --shadow: 0 8px 28px rgba(17, 24, 39, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px);
        }

        .bar {
            max-width: 1120px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 650;
        }

        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 22px 20px 48px;
        }

        .toolbar,
        .section,
        .item {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .toolbar {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 11px;
            color: var(--text);
            background: #fff;
            font: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
        }

        button {
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 10px 13px;
            min-height: 40px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: #eef4ff;
            color: #0b5dcc;
        }

        button.primary {
            background: var(--primary);
            color: #fff;
        }

        button.danger {
            background: #fff1f0;
            color: var(--danger);
        }

        button.ghost {
            background: #fff;
            color: var(--muted);
            border-color: var(--line);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }

        .section {
            margin-bottom: 16px;
            overflow: hidden;
        }

        .section-head {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            background: #fbfcfe;
        }

        .items {
            padding: 14px 16px 16px;
            display: grid;
            gap: 12px;
        }

        .item {
            box-shadow: none;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .item label:nth-child(2),
        .item label:nth-child(4) {
            grid-column: span 1;
        }

        .item .wide {
            grid-column: 1 / -1;
        }

        .item-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .empty {
            padding: 26px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .status {
            min-height: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .status.ok {
            color: #067647;
        }

        .status.err {
            color: var(--danger);
        }

        @media (max-width: 720px) {
            .bar,
            .toolbar,
            .section-head,
            .item {
                grid-template-columns: 1fr;
            }

            .actions {
                justify-content: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <h1>导航后台</h1>
            <div class="actions">
                <button class="ghost" id="reloadBtn">重新加载</button>
                <button class="primary" id="saveBtn">保存配置</button>
            </div>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <label>
                背景图片 API
                <input id="backgroundApi" placeholder="https://example.com/random-image">
            </label>
            <button id="addSectionBtn">添加分类</button>
        </div>

        <div class="status" id="status"></div>
        <div id="sections"></div>
    </main>

    <template id="sectionTemplate">
        <section class="section">
            <div class="section-head">
                <label>
                    分类名称
                    <input class="section-name" placeholder="例如：导航">
                </label>
                <div class="actions">
                    <button class="add-item">添加入口</button>
                    <button class="danger remove-section">删除分类</button>
                </div>
            </div>
            <div class="items"></div>
        </section>
    </template>

    <template id="itemTemplate">
        <div class="item">
            <label>
                名称
                <input class="item-name" placeholder="例如：网盘下载">
            </label>
            <label>
                链接
                <input class="item-url" placeholder="https://example.com/">
            </label>
            <label>
                图标 class
                <input class="item-icon" placeholder="fa-solid fa-link">
            </label>
            <label class="wide">
                描述
                <textarea class="item-description" rows="2" placeholder="鼠标悬停时显示的描述"></textarea>
            </label>
            <div class="item-actions">
                <button class="danger remove-item">删除入口</button>
            </div>
        </div>
    </template>

    <script>
        const apiUrl = '/admin/api/config';
        const sectionsEl = document.getElementById('sections');
        const statusEl = document.getElementById('status');
        const backgroundApiEl = document.getElementById('backgroundApi');
        const sectionTemplate = document.getElementById('sectionTemplate');
        const itemTemplate = document.getElementById('itemTemplate');

        function setStatus(text, type) {
            statusEl.textContent = text || '';
            statusEl.className = `status ${type || ''}`;
        }

        function createItem(item = {}) {
            const node = itemTemplate.content.firstElementChild.cloneNode(true);
            node.querySelector('.item-name').value = item.name || '';
            node.querySelector('.item-url').value = item.url || '';
            node.querySelector('.item-icon').value = item.icon || '';
            node.querySelector('.item-description').value = item.description || '';
            node.querySelector('.remove-item').addEventListener('click', () => {
                node.remove();
            });
            return node;
        }

        function createSection(name = '', items = []) {
            const node = sectionTemplate.content.firstElementChild.cloneNode(true);
            const nameInput = node.querySelector('.section-name');
            const itemsEl = node.querySelector('.items');
            nameInput.value = name;

            node.querySelector('.add-item').addEventListener('click', () => {
                itemsEl.appendChild(createItem({ icon: 'fa-solid fa-link' }));
            });

            node.querySelector('.remove-section').addEventListener('click', () => {
                node.remove();
            });

            if (items.length) {
                items.forEach(item => itemsEl.appendChild(createItem(item)));
            } else {
                itemsEl.appendChild(createItem({ icon: 'fa-solid fa-link' }));
            }

            return node;
        }

        function readForm() {
            const data = {
                backgroundApi: backgroundApiEl.value.trim()
            };

            const usedNames = new Set(['backgroundApi']);
            sectionsEl.querySelectorAll('.section').forEach((section, index) => {
                const rawName = section.querySelector('.section-name').value.trim();
                const sectionName = rawName || `未命名分类${index + 1}`;
                let uniqueName = sectionName;
                let suffix = 2;

                while (usedNames.has(uniqueName)) {
                    uniqueName = `${sectionName}-${suffix++}`;
                }
                usedNames.add(uniqueName);

                data[uniqueName] = Array.from(section.querySelectorAll('.item')).map(item => ({
                    name: item.querySelector('.item-name').value.trim(),
                    url: item.querySelector('.item-url').value.trim(),
                    icon: item.querySelector('.item-icon').value.trim() || 'fa-solid fa-link',
                    description: item.querySelector('.item-description').value.trim()
                })).filter(item => item.name || item.url);
            });

            return data;
        }

        function render(data) {
            backgroundApiEl.value = data.backgroundApi || '';
            sectionsEl.innerHTML = '';

            Object.keys(data).forEach(key => {
                if (key === 'backgroundApi') return;
                if (!Array.isArray(data[key])) return;
                sectionsEl.appendChild(createSection(key, data[key]));
            });

            if (!sectionsEl.children.length) {
                sectionsEl.appendChild(createSection('导航', []));
            }
        }

        async function loadConfig() {
            setStatus('正在加载配置...');
            const response = await fetch(`${apiUrl}?t=${Date.now()}`, {
                credentials: 'same-origin',
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`加载失败：${response.status}`);
            }

            render(await response.json());
            setStatus('配置已加载', 'ok');
        }

        async function saveConfig() {
            const data = readForm();
            setStatus('正在保存...');

            const response = await fetch(apiUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data, null, 4)
            });

            const text = await response.text();
            if (!response.ok) {
                throw new Error(text || `保存失败：${response.status}`);
            }

            setStatus('已保存，前台刷新后生效', 'ok');
        }

        document.getElementById('addSectionBtn').addEventListener('click', () => {
            sectionsEl.appendChild(createSection('新分类', []));
        });

        document.getElementById('reloadBtn').addEventListener('click', () => {
            loadConfig().catch(error => setStatus(error.message, 'err'));
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            saveConfig().catch(error => setStatus(error.message, 'err'));
        });

        loadConfig().catch(error => setStatus(error.message, 'err'));
    </script>
</body>

</html>
