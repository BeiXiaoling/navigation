    location = /admin {
        auth_basic "Navigation Admin";
        auth_basic_user_file /www/sites/www.ovo-s.com/index/.admin_htpasswd;
        default_type text/html;
        alias /www/sites/www.ovo-s.com/index/admin.html;
    }

    location = /admin/ {
        return 302 /admin;
    }

    location = /admin/api/config {
        auth_basic "Navigation Admin";
        auth_basic_user_file /www/sites/www.ovo-s.com/index/.admin_htpasswd;
        client_max_body_size 256k;
        default_type application/json;

        content_by_lua_block {
            local cjson = require "cjson.safe"
            local file_path = "/www/sites/www.ovo-s.com/index/navigation.json"
            ngx.header["Cache-Control"] = "no-store"

            local method = ngx.req.get_method()
            if method == "GET" then
                local file = io.open(file_path, "rb")
                if not file then
                    ngx.status = 500
                    ngx.say('{"error":"failed to read navigation.json"}')
                    return
                end

                local content = file:read("*a")
                file:close()
                ngx.say(content)
                return
            end

            if method ~= "POST" then
                ngx.status = 405
                ngx.header["Allow"] = "GET, POST"
                ngx.say('{"error":"method not allowed"}')
                return
            end

            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                local body_file = ngx.req.get_body_file()
                if body_file then
                    local file = io.open(body_file, "rb")
                    if file then
                        body = file:read("*a")
                        file:close()
                    end
                end
            end

            if not body or body == "" then
                ngx.status = 400
                ngx.say('{"error":"empty request body"}')
                return
            end

            local data, decode_err = cjson.decode(body)
            if not data or type(data) ~= "table" then
                ngx.status = 400
                ngx.say(cjson.encode({ error = "invalid json", detail = decode_err }))
                return
            end

            for key, value in pairs(data) do
                if key == "backgroundApi" then
                    if type(value) ~= "string" then
                        ngx.status = 400
                        ngx.say('{"error":"backgroundApi must be a string"}')
                        return
                    end
                elseif type(value) ~= "table" then
                    ngx.status = 400
                    ngx.say(cjson.encode({ error = "section must be an array", section = key }))
                    return
                end
            end

            local tmp_path = file_path .. ".tmp"
            local file, open_err = io.open(tmp_path, "wb")
            if not file then
                ngx.status = 500
                ngx.say(cjson.encode({ error = "failed to open temp file", detail = open_err }))
                return
            end

            file:write(body)
            file:write("\n")
            file:close()

            local ok, rename_err = os.rename(tmp_path, file_path)
            if not ok then
                os.remove(tmp_path)
                ngx.status = 500
                ngx.say(cjson.encode({ error = "failed to replace navigation.json", detail = rename_err }))
                return
            end

            ngx.say('{"ok":true}')
        }
    }
